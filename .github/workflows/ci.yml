name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full test suite
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # SDL_image and SDL_ttf use Homebrew libraries on macOS, so their
          # nested vendored dependencies are not part of this build.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install native dependencies
        run: brew install ccache ninja llvm freetype libavif libtiff webp

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Build once and run all tests
        run: ./scripts/build_and_test.sh --all-tests-with-ui
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software

      - name: Report compiler cache statistics
        if: ${{ always() }}
        run: ccache --show-stats

  clang-tidy:
    name: Clang-tidy
    runs-on: macos-latest
    timeout-minutes: 45
    # Standard GitHub-hosted ARM macOS runners provide three CPUs. Keep local
    # full scans at lint.sh's heat-conscious two-worker default, but use the
    # runner's full capacity in CI.
    env:
      LINT_JOBS: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install analysis dependencies
        run: brew install ninja llvm freetype libavif libtiff webp

      - name: Configure compilation database
        run: cmake --preset dev

      - name: Analyze project translation units
        run: ./scripts/lint.sh --strict --all
