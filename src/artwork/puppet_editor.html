<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet Editor</title>
<style>
:root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #15181d; color: #eef1f5; }
* { box-sizing: border-box; }
body { margin: 0; }
header { padding: 12px 20px 0; background: #222832; box-shadow: 0 3px 12px #0008; }
h1 { margin: 0 0 10px; font-size: 17px; }
.workspace { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; }
.workspace select, .workspace input, .workspace button { margin: 0; width: auto; flex: 1; }
.workspace button { flex: 0 0 auto; margin: 0; }
.steps { display: flex; gap: 4px; }
.steps button { flex: 1; padding: 9px 6px 11px; border: 1px solid #38414e; border-bottom: 3px solid #38414e; border-radius: 6px 6px 0 0; background: #1b2028; color: #99a2ae; font-size: 13px; cursor: pointer; }
.steps button.done { color: #83e1ad; border-bottom-color: #2f7d55; }
.steps button.blocked { color: #ffd18a; border-bottom-color: #8a6a2f; }
.steps button.active { background: #2b3340; color: #fff; border-bottom-color: #5b9dd9; }
main { display: grid; grid-template-columns: minmax(320px, 1fr) 360px; gap: 18px; align-items: start; padding: 18px 20px; }
.viewport { overflow: auto; border-radius: 8px; background: #0f1216; box-shadow: 0 10px 30px #0008; max-height: 82vh; }
.stage { position: relative; background: #fff; image-rendering: pixelated; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#artwork { image-rendering: pixelated; }
#skeleton { touch-action: none; cursor: crosshair; }
.tip { position: absolute; z-index: 2; padding: 3px 6px; border-radius: 4px; background: #0f1216ee; border: 1px solid #566171; color: #eef1f5; font: 11px/1.3 ui-monospace, monospace; pointer-events: none; white-space: nowrap; }
.panel { background: #222832; border: 1px solid #38414e; border-radius: 8px; padding: 14px; }
h2 { margin: 0 0 4px; font-size: 14px; }
.blocker { margin: 0 0 12px; color: #ffd18a; font-size: 12px; min-height: 15px; }
label { display: block; margin: 0 0 10px; color: #cbd2dc; font-size: 12px; }
select, button, input[type="text"], input[type="number"] { width: 100%; margin-top: 4px; padding: 8px 9px; border: 1px solid #566171; border-radius: 5px; background: #303844; color: #fff; font-size: 13px; }
button { cursor: pointer; margin-bottom: 8px; }
button.primary { background: #246c49; border-color: #3b9a6e; }
button.danger { background: #6c2424; border-color: #9a3b3b; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; }
.check input { width: auto; margin: 0; }
.list { margin: 0 0 12px; padding: 0; list-style: none; font: 12px/1.7 ui-monospace, monospace; max-height: 190px; overflow: auto; }
.list li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px; border-radius: 4px; }
.list li.selected { background: #2b3340; }
.list li span { cursor: pointer; overflow-wrap: anywhere; }
.list li em { color: #8b94a1; font-style: normal; }
.note { margin: 0 0 12px; color: #8b94a1; font-size: 12px; line-height: 1.45; }
.status { margin-top: 10px; padding: 8px; border-radius: 5px; background: #171b21; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
.status.bad { color: #ff9d9d; }
.status.good { color: #83e1ad; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
<h1>Puppet Editor</h1>
<div class="workspace" id="workspace"></div>
<div class="steps" id="steps"></div>
</header>
<main>
<div class="viewport">
<div class="stage" id="stage">
<canvas id="artwork"></canvas>
<canvas id="skeleton"></canvas>
<div id="tip" class="tip" hidden></div>
</div>
</div>
<aside class="panel">
<h2 id="step-title"></h2>
<p class="blocker" id="blocker"></p>
<div id="controls"></div>
<div id="status" class="status">Loading…</div>
</aside>
</main>
<script>
// The document on the server is the only copy of what the puppet is. This page
// never edits it: every control posts a command and redraws whatever comes
// back. What lives here instead is view state — which step is open, which frame
// is showing, zoom, playback — which is one person's view and belongs in this
// browser rather than in a file everyone shares.
const STEPS = ['Source', 'Skeleton', 'Parts', 'Frames', 'Export'];
const viewKey = `zebes-puppet-editor:${location.pathname}`;
const view = Object.assign(
  {step: 0, frame: 0, zoom: 2, showGuide: true, showSource: true, showBuild: true,
   selectedPart: '', scope: 'frame', drawTarget: 'claim', keepBoneLength: false,
   chain: 'spine', stretchBone: '', updateRigReferences: true},
  readView());
let session = null;
let dragging = null;
let playing = null;
// The built geometry and one image per part. Both are derived from the
// document, so they are refetched when the server says it rebuilt and are never
// edited here.
let build = null;
let buildGeneration = -1;
const sprites = {source: null, guide: null, parts: new Map()};
// The polygon being drawn, in source pixels. It exists only until it is closed
// and posted; an unfinished shape is not something the document should hold.
let drawing = null;

const stage = document.querySelector('#stage');
const artwork = document.querySelector('#artwork');
const skeleton = document.querySelector('#skeleton');
const artworkContext = artwork.getContext('2d');
const skeletonContext = skeleton.getContext('2d');
const controls = document.querySelector('#controls');
const statusBox = document.querySelector('#status');
const tip = document.querySelector('#tip');
artworkContext.imageSmoothingEnabled = false;

function readView() {
  try { return JSON.parse(localStorage.getItem(viewKey)) ?? {}; } catch (_) { return {}; }
}
function saveView() {
  try { localStorage.setItem(viewKey, JSON.stringify(view)); } catch (_) { /* private mode */ }
}
function setStatus(message, kind) {
  statusBox.textContent = message;
  statusBox.className = `status ${kind ?? ''}`;
}
function puppet() { return session.document; }
function frames() { return puppet().frames; }
function currentFrame() { return frames()[Math.min(view.frame, frames().length - 1)] ?? null; }
function jointNames() { return Object.keys(puppet().rest_pose).sort(); }
// Sorted for reading only. The document keeps the order bones were added in,
// because that order is what numbers them in the build.
function boneNames() { return puppet().bones.map(bone => bone.name).sort(); }
function sortedBones() {
  return [...puppet().bones].sort((first, second) => first.name.localeCompare(second.name));
}
// The joints grouped the way a person thinks of them, which is the grouping the
// chains record and the one a rig written out of this document carries.
function chainSummary() {
  const limbs = new Map();
  for (const [joint, chain] of Object.entries(puppet().joint_chains)) {
    if (!limbs.has(chain)) limbs.set(chain, []);
    limbs.get(chain).push(joint);
  }
  return [...limbs].sort().map(([chain, joints]) => ({chain, joints: joints.sort().join(' ')}));
}

// Which step a piece of state belongs to, so the header can colour each one and
// the panel can refuse to run ahead of what the document can support yet.
function stepState(index) {
  const doc = puppet();
  const has = [
    doc.source_image !== '',
    Object.keys(doc.rest_pose).length > 0 && doc.bones.length > 0,
    doc.parts.length > 0 && doc.parts.every(part =>
      part.outlines.length > 0 || part.fills.length > 0),
    doc.frames.length > 0 && doc.anchor_frame !== '',
    session.ready,
  ];
  return has[index] ? 'done' : 'blocked';
}

async function post(commands) {
  setStatus('Working…');
  try {
    const response = await fetch('/api/commands', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(commands)
    });
    const text = await response.text();
    if (!response.ok) {
      setStatus(text.trim(), 'bad');
      // The server may have been restarted under an open page, in which case
      // the page is describing a document nobody has open. Refetching puts what
      // is on screen back in step with what is true.
      if (response.status === 409 || response.status === 404) await refetchSession();
      return false;
    }
    session = JSON.parse(text);
    await loadSprites();
    await loadBuild();
    render();
    setStatus(session.ready ? 'Saved. Ready to build.' : `Saved. Next: ${session.blocker}`,
              session.ready ? 'good' : '');
    return true;
  } catch (error) {
    setStatus(String(error), 'bad');
    return false;
  }
}

// Reloads the whole session without changing anything, for when the page and
// the server have drifted apart.
async function refetchSession() {
  const response = await fetch('/api/session', {cache: 'no-store'});
  if (!response.ok) return;
  session = await response.json();
  build = null;
  buildGeneration = -1;
  drawing = null;
  await loadSprites();
  await loadBuild();
  render();
}

function loadImage(url) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => resolve(null);
    image.src = `${url}?v=${Date.now()}`;
  });
}
async function loadSprites() {
  if (session.open_document === '') {
    sprites.source = null;
    sprites.guide = null;
    return;
  }
  const doc = puppet();
  sprites.source = doc.source_image ? await loadImage('/source.png') : null;
  sprites.guide = doc.guide_image ? await loadImage('/guide.png') : null;
}

// Refetches the mesh and part artwork only when the server reports a rebuild,
// so dragging a joint moves pixels already in hand.
async function loadBuild() {
  if (!session.ready) {
    build = null;
    buildGeneration = -1;
    sprites.parts.clear();
    return;
  }
  if (session.build_generation === buildGeneration) return;
  const response = await fetch('/api/build', {cache: 'no-store'});
  if (!response.ok) { build = null; return; }
  build = await response.json();
  buildGeneration = session.build_generation;
  sprites.parts.clear();
  for (const part of build.parts) {
    const image = await loadImage(`/parts/${encodeURIComponent(part.name)}.png`);
    if (image !== null) sprites.parts.set(part.name, image);
  }
}

function canvasSize() {
  const doc = puppet();
  return {width: doc.width || 256, height: doc.height || 256};
}
// Screen pixels per source pixel for one unit of overlay. Lines and dots are
// interface, not artwork, so they are drawn at the screen's own resolution and
// asked to stay the same size however far the artwork is zoomed.
function ui(pixels) { return pixels / view.zoom; }

function applyZoom() {
  const {width, height} = canvasSize();
  // The artwork canvas stays one canvas pixel per source pixel and is blown up
  // by CSS, which is what keeps the art crisp. The overlay canvas is the full
  // screen size instead, so its lines are smooth rather than blocky.
  artwork.width = width;
  artwork.height = height;
  skeleton.width = width * view.zoom;
  skeleton.height = height * view.zoom;
  skeletonContext.setTransform(view.zoom, 0, 0, view.zoom, 0, 0);
  stage.style.width = `${width * view.zoom}px`;
  stage.style.height = `${height * view.zoom}px`;
}

const CHAIN_COLORS = ['#eb4637', '#faa532', '#3ca5fa', '#46c864', '#a582f5', '#e66ee6', '#beaa6e'];
// One colour per limb, so a whole arm reads as one thing on the canvas. The
// colour follows the chain name, not the order bones were added, which is what
// made the two halves of one arm come out different colours.
function chainColor(chain) {
  const chains = [...new Set(Object.values(puppet().joint_chains))].sort();
  const at = chains.indexOf(chain);
  return CHAIN_COLORS[(at < 0 ? 0 : at) % CHAIN_COLORS.length];
}
// A bone belongs to the limb of the joint it ends at, because that is the joint
// it moves: the upper arm ends at the elbow and both are the arm.
function boneColor(bone) { return chainColor(puppet().joint_chains[bone.end_joint]); }

// How one bone moves from its bind position to where a pose puts it. A point is
// split into how far along the bone it sits and how far off to the side, the
// along part takes the stretch when that bone is allowed one, and the pair is
// rebuilt against the posed bone.
//
// This mirrors TransformPoint in layered_puppet.cc line for line, because a
// preview that does its own thing is a preview that lies. It used to scale by
// the bone's length ratio unconditionally while the renderer never scaled at
// all, so a shortened bone showed a shrinking limb here and drew at full length
// in the finished frame.
function boneTransform(pose, boneIndex) {
  const bone = build.bones[boneIndex];
  const bindStart = build.source_joints[bone.start];
  const bindEnd = build.source_joints[bone.end];
  const poseStart = pose[bone.start];
  const poseEnd = pose[bone.end];
  const bindLength = Math.hypot(bindEnd[0] - bindStart[0], bindEnd[1] - bindStart[1]);
  const poseLength = Math.hypot(poseEnd[0] - poseStart[0], poseEnd[1] - poseStart[1]);
  const bindUnit = bindLength > 0
    ? [(bindEnd[0] - bindStart[0]) / bindLength, (bindEnd[1] - bindStart[1]) / bindLength] : [1, 0];
  const poseUnit = poseLength > 0
    ? [(poseEnd[0] - poseStart[0]) / poseLength, (poseEnd[1] - poseStart[1]) / poseLength] : [1, 0];
  const stretch = bone.may_stretch === true && bindLength > 0 ? poseLength / bindLength : 1;
  const angle = Math.atan2(poseUnit[1], poseUnit[0]) - Math.atan2(bindUnit[1], bindUnit[0]);
  return {bindStart, poseStart, bindUnit, poseUnit, stretch, angle};
}
function transformPoint(point, move) {
  const x = point[0] - move.bindStart[0];
  const y = point[1] - move.bindStart[1];
  const along = (x * move.bindUnit[0] + y * move.bindUnit[1]) * move.stretch;
  const away = -x * move.bindUnit[1] + y * move.bindUnit[0];
  return [move.poseStart[0] + move.poseUnit[0] * along - move.poseUnit[1] * away,
          move.poseStart[1] + move.poseUnit[1] * along + move.poseUnit[0] * away];
}
// The same map as a canvas matrix, for a rigid part drawn in one piece.
function boneMatrix(move) {
  const [ux, uy] = move.bindUnit;
  const [tx, ty] = move.poseUnit;
  const s = move.stretch;
  const a = s * tx * ux + ty * uy;
  const b = s * ty * ux - tx * uy;
  const c = s * tx * uy - ty * ux;
  const d = s * ty * uy + tx * ux;
  return [a, b, c, d,
          move.poseStart[0] - a * move.bindStart[0] - c * move.bindStart[1],
          move.poseStart[1] - b * move.bindStart[0] - d * move.bindStart[1]];
}

// The affine map taking one source triangle onto its deformed position. Null
// when the source triangle has collapsed and has no inverse.
function affine(from, to) {
  const denominator = from[0][0] * (from[1][1] - from[2][1]) +
      from[1][0] * (from[2][1] - from[0][1]) + from[2][0] * (from[0][1] - from[1][1]);
  if (Math.abs(denominator) < 0.0001) return null;
  const solve = values => ({
    x: (values[0] * (from[1][1] - from[2][1]) + values[1] * (from[2][1] - from[0][1]) +
        values[2] * (from[0][1] - from[1][1])) / denominator,
    y: (values[0] * (from[2][0] - from[1][0]) + values[1] * (from[0][0] - from[2][0]) +
        values[2] * (from[1][0] - from[0][0])) / denominator,
    offset: (values[0] * (from[1][0] * from[2][1] - from[2][0] * from[1][1]) +
             values[1] * (from[2][0] * from[0][1] - from[0][0] * from[2][1]) +
             values[2] * (from[0][0] * from[1][1] - from[1][0] * from[0][1])) / denominator
  });
  const horizontal = solve(to.map(point => point[0]));
  const vertical = solve(to.map(point => point[1]));
  return [horizontal.x, vertical.x, horizontal.y, vertical.y, horizontal.offset, vertical.offset];
}

// Nudges a triangle outwards before drawing it. Neighbouring triangles are
// clipped to their own edges, and without this the seam between two of them
// shows as a hairline of background.
function grown(points) {
  const centre = [(points[0][0] + points[1][0] + points[2][0]) / 3,
                  (points[0][1] + points[1][1] + points[2][1]) / 3];
  return points.map(point => {
    const x = point[0] - centre[0];
    const y = point[1] - centre[1];
    const length = Math.hypot(x, y);
    return length > 0 ? [point[0] + x * 0.65 / length, point[1] + y * 0.65 / length] : point;
  });
}

function drawTriangle(image, from, to) {
  const expanded = grown(to);
  const matrix = affine(from, expanded);
  if (matrix === null) return;
  artworkContext.save();
  artworkContext.beginPath();
  artworkContext.moveTo(expanded[0][0], expanded[0][1]);
  artworkContext.lineTo(expanded[1][0], expanded[1][1]);
  artworkContext.lineTo(expanded[2][0], expanded[2][1]);
  artworkContext.closePath();
  artworkContext.clip();
  artworkContext.transform(...matrix);
  artworkContext.drawImage(image, 0, 0);
  artworkContext.restore();
}

// Places a skinned part's mesh the way TransformMeshVertex does: blend the two
// bones' turn, not the two transformed points.
//
// Averaging the points is linear blend skinning. The average of two rotations
// is not a rotation, so the joint loses area as it bends and the elbow pinches.
// Blending the angle keeps every step of the way a rigid turn. The preview used
// to average the points, so a bent elbow looked thinner here than it came out.
function skinnedVertices(pose, part, first, second) {
  const shared = part.bones.length === 2 ? sharedJoint(part) : null;
  if (shared === null) {
    return part.mesh.vertices.map(vertex => transformPoint(vertex.point, first));
  }
  const pivot = build.source_joints[shared];
  const firstImage = transformPoint(pivot, first);
  const secondImage = transformPoint(pivot, second);
  const stretching = first.stretch !== 1 || second.stretch !== 1;
  // Shortest arc, so a chain straddling half a turn does not swing the long way
  // round between its two bones.
  const difference = Math.atan2(Math.sin(second.angle - first.angle),
                                Math.cos(second.angle - first.angle));
  return part.mesh.vertices.map(vertex => {
    const weight = vertex.first_bone_weight;
    const angle = first.angle + (1 - weight) * difference;
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    let x = vertex.point[0] - pivot[0];
    let y = vertex.point[1] - pivot[1];
    if (stretching) {
      const stretch = first.stretch * weight + second.stretch * (1 - weight);
      x *= stretch;
      y *= stretch;
    }
    const originX = firstImage[0] * weight + secondImage[0] * (1 - weight);
    const originY = firstImage[1] * weight + secondImage[1] * (1 - weight);
    return [originX + cosine * x - sine * y, originY + sine * x + cosine * y];
  });
}

// The joint a skinned part's two bones meet at, or null when they do not meet.
function sharedJoint(part) {
  const one = build.bones[part.bones[0]];
  const two = build.bones[part.bones[1]];
  for (const joint of [one.start, one.end]) {
    if (joint === two.start || joint === two.end) return joint;
  }
  return null;
}

function drawPart(pose, partIndex) {
  const part = build.parts[partIndex];
  const image = sprites.parts.get(part.name);
  if (image === undefined) return;
  if (part.mesh.triangles.length === 0) {
    artworkContext.save();
    artworkContext.transform(...boneMatrix(boneTransform(pose, part.bones[0])));
    artworkContext.drawImage(image, 0, 0);
    artworkContext.restore();
    return;
  }
  const first = boneTransform(pose, part.bones[0]);
  const second = part.bones.length === 2 ? boneTransform(pose, part.bones[1]) : first;
  const moved = skinnedVertices(pose, part, first, second);
  for (const triangle of part.mesh.triangles) {
    drawTriangle(image, triangle.map(index => part.mesh.vertices[index].point),
                 triangle.map(index => moved[index]));
  }
}

// The posed puppet for the current frame. Drawn only on the Frames and Export
// steps: the earlier steps are bind space, where the flat source is the thing
// to work against.
function drawBuild() {
  if (build === null || !view.showBuild || inBindSpace()) return false;
  const frame = currentFrame();
  if (frame === null) return false;
  const pose = build.poses.find(candidate => candidate.name === frame.name);
  if (pose === undefined) return false;
  for (const partIndex of pose.draw_order) drawPart(pose.joints, partIndex);
  return true;
}

function drawArtwork() {
  const {width, height} = canvasSize();
  artworkContext.clearRect(0, 0, width, height);
  if (view.showGuide && sprites.guide !== null) {
    artworkContext.globalAlpha = 0.35;
    artworkContext.drawImage(sprites.guide, 0, 0);
    artworkContext.globalAlpha = 1;
  }
  if (drawBuild()) return;
  if (view.showSource && sprites.source !== null) artworkContext.drawImage(sprites.source, 0, 0);
}

// Steps that work in bind space: where the artwork actually sits, and what
// every outline and joint position is written against. Showing a posed frame
// here would have someone trace an outline onto a limb that has moved.
function inBindSpace() { return view.step === 0 || view.step === 1 || view.step === 2; }

// The pose being drawn: the rest pose in bind space, otherwise the frame being
// looked at.
function activePose() {
  if (inBindSpace() || frames().length === 0) return puppet().rest_pose;
  return currentFrame()?.pose ?? puppet().rest_pose;
}

function tracePolygon(polygon, close) {
  skeletonContext.beginPath();
  polygon.forEach(([x, y], at) =>
    at === 0 ? skeletonContext.moveTo(x, y) : skeletonContext.lineTo(x, y));
  if (close) skeletonContext.closePath();
  skeletonContext.stroke();
}

function drawOutlines() {
  if (view.step !== 2) return;
  for (const part of puppet().parts) {
    const selected = part.name === view.selectedPart;
    skeletonContext.lineWidth = ui(selected ? 2 : 1.2);
    skeletonContext.strokeStyle = selected ? '#35d07f' : '#35d07f66';
    for (const polygon of part.outlines) {
      if (polygon.length >= 3) tracePolygon(polygon, true);
    }
    skeletonContext.strokeStyle = selected ? '#f05b66' : '#f05b6655';
    for (const polygon of part.exclude_outlines) {
      if (polygon.length >= 3) tracePolygon(polygon, true);
    }
  }
  if (drawing === null) return;

  if (drawing.length > 1) {
    skeletonContext.strokeStyle = '#0d1014cc';
    skeletonContext.lineWidth = ui(4);
    tracePolygon(drawing, false);
    skeletonContext.strokeStyle = view.drawTarget === 'claim' ? '#8ef7bd' : '#ff9d9d';
    skeletonContext.lineWidth = ui(2);
    tracePolygon(drawing, false);
  }
  for (const [x, y] of drawing) {
    skeletonContext.beginPath();
    skeletonContext.arc(x, y, ui(3), 0, Math.PI * 2);
    skeletonContext.fillStyle = view.drawTarget === 'claim' ? '#8ef7bd' : '#ff9d9d';
    skeletonContext.fill();
    skeletonContext.strokeStyle = '#0d1014';
    skeletonContext.lineWidth = ui(1.5);
    skeletonContext.stroke();
  }
  // The first point is drawn larger because clicking it is what closes the
  // shape, and there is nothing else on screen that says so.
  if (drawing.length >= 3) {
    skeletonContext.beginPath();
    skeletonContext.arc(drawing[0][0], drawing[0][1], ui(6), 0, Math.PI * 2);
    skeletonContext.strokeStyle = '#0d1014';
    skeletonContext.lineWidth = ui(3);
    skeletonContext.stroke();
    skeletonContext.strokeStyle = '#8ef7bd';
    skeletonContext.lineWidth = ui(1.5);
    skeletonContext.stroke();
  }
}

function drawSkeleton() {
  const {width, height} = canvasSize();
  skeletonContext.clearRect(0, 0, width, height);
  skeletonContext.lineJoin = 'round';
  skeletonContext.lineCap = 'round';
  drawOutlines();
  const pose = activePose();
  // Every bone is drawn twice: a dark backing line first, the colour over it.
  // The artwork underneath can be any colour, and a single pale line vanishes
  // against pale pixels.
  // On the Parts step the selected part's own bones are drawn white and thick,
  // because whether they lie inside the shape being traced is the one thing
  // that decides if the part will bend correctly.
  const selected = view.step === 2
    ? puppet().parts.find(part => part.name === view.selectedPart)?.bones ?? []
    : [];
  for (const pass of [{colour: null, width: ui(4)}, {colour: 'bone', width: ui(2)}]) {
    for (const bone of puppet().bones) {
      const start = pose[bone.start_joint];
      const end = pose[bone.end_joint];
      if (start === undefined || end === undefined) continue;
      const owned = selected.includes(bone.name);
      skeletonContext.beginPath();
      skeletonContext.moveTo(start[0], start[1]);
      skeletonContext.lineTo(end[0], end[1]);
      skeletonContext.strokeStyle = pass.colour === null ? '#0d1014cc'
                                  : owned ? '#ffffff' : boneColor(bone);
      skeletonContext.lineWidth = owned ? pass.width * 1.8 : pass.width;
      skeletonContext.stroke();
    }
  }
  for (const [name, point] of Object.entries(pose)) {
    const held = dragging?.joint === name;
    skeletonContext.beginPath();
    skeletonContext.arc(point[0], point[1], ui(held ? 5 : 3.5), 0, Math.PI * 2);
    skeletonContext.fillStyle = held ? '#ffd166' : '#f4f7fa';
    skeletonContext.fill();
    skeletonContext.strokeStyle = '#0d1014';
    skeletonContext.lineWidth = ui(1.5);
    skeletonContext.stroke();
  }
}

async function openOrCreate(route, name) {
  if (name === '') return false;
  setStatus('Working…');
  try {
    const response = await fetch(route, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name})
    });
    const text = await response.text();
    if (!response.ok) { setStatus(text.trim(), 'bad'); return false; }
    session = JSON.parse(text);
    // A different document means different artwork, a different mesh and a
    // different frame count, so nothing from the last one is kept.
    build = null;
    buildGeneration = -1;
    drawing = null;
    view.frame = 0;
    view.selectedPart = '';
    saveView();
    await loadSprites();
    await loadBuild();
    render();
    setStatus(session.ready ? `${session.open_document}: ready to build.`
                            : `${session.open_document}: next: ${session.blocker}`,
              session.ready ? 'good' : '');
    return true;
  } catch (error) {
    setStatus(String(error), 'bad');
    return false;
  }
}

// Rebuilt only when the list of documents or the open one changes. Every edit
// redraws the page, and rebuilding this row each time would empty the name
// someone is halfway through typing.
let workspaceKey = null;
function renderWorkspace() {
  const key = [session.open_document, ...session.documents].join('/');
  if (key === workspaceKey) return;
  workspaceKey = key;

  const chooser = select(['', ...session.documents], session.open_document);
  chooser.addEventListener('change', () => openOrCreate('/api/open', chooser.value));
  const created = textInput('', 'name the new puppet');
  const create = async () => {
    const typed = created.value.trim().replace(/\.json$/, '');
    if (!/^[A-Za-z0-9_-]+$/.test(typed)) {
      setStatus('A puppet name is letters, digits, _ or -.', 'bad');
      return;
    }
    // Cleared only once the file exists, so a refused name is still on screen
    // to correct rather than typed again from memory.
    if (await openOrCreate('/api/create', `${typed}.json`)) created.value = '';
  };
  created.addEventListener('keydown', event => {
    if (event.key === 'Enter') create();
  });
  document.querySelector('#workspace').replaceChildren(
    chooser, created, button('New puppet', create));
}

function renderSteps() {
  const container = document.querySelector('#steps');
  container.replaceChildren(...STEPS.map((name, index) => {
    const button = window.document.createElement('button');
    button.textContent = name;
    button.className = `${stepState(index)}${index === view.step ? ' active' : ''}`;
    button.addEventListener('click', () => { view.step = index; saveView(); render(); });
    return button;
  }));
}

function field(labelText, node) {
  const label = window.document.createElement('label');
  label.textContent = labelText;
  label.append(node);
  return label;
}
function select(options, value) {
  const node = window.document.createElement('select');
  for (const option of options) {
    const item = window.document.createElement('option');
    item.value = typeof option === 'string' ? option : option.value;
    item.textContent = typeof option === 'string' ? option : option.label;
    node.append(item);
  }
  node.value = value ?? '';
  return node;
}
function button(text, onClick, className) {
  const node = window.document.createElement('button');
  node.textContent = text;
  if (className !== undefined) node.className = className;
  node.addEventListener('click', onClick);
  return node;
}
function textInput(value, placeholder) {
  const node = window.document.createElement('input');
  node.type = 'text';
  node.value = value ?? '';
  if (placeholder !== undefined) node.placeholder = placeholder;
  return node;
}
function numberInput(value, min) {
  const node = window.document.createElement('input');
  node.type = 'number';
  node.value = String(value);
  if (min !== undefined) node.min = String(min);
  return node;
}
function checkbox(labelText, checked, onChange) {
  const label = window.document.createElement('label');
  label.className = 'check';
  const node = window.document.createElement('input');
  node.type = 'checkbox';
  node.checked = checked;
  node.addEventListener('change', () => onChange(node.checked));
  label.append(node, window.document.createTextNode(labelText));
  return label;
}
function note(text) {
  const node = window.document.createElement('p');
  node.className = 'note';
  node.textContent = text;
  return node;
}
function list(items, onSelect) {
  const node = window.document.createElement('ul');
  node.className = 'list';
  for (const item of items) {
    const row = window.document.createElement('li');
    if (item.selected === true) row.className = 'selected';
    const name = window.document.createElement('span');
    name.textContent = item.name;
    if (onSelect !== undefined) name.addEventListener('click', () => onSelect(item.name));
    const detail = window.document.createElement('em');
    detail.textContent = item.detail ?? '';
    row.append(name, detail);
    node.append(row);
  }
  return node;
}
function group(...nodes) {
  const node = window.document.createElement('div');
  node.append(...nodes);
  return node;
}
function rowOf(...nodes) {
  const node = window.document.createElement('div');
  node.className = nodes.length === 3 ? 'row3' : 'row';
  node.append(...nodes);
  return node;
}

// The commands that carry the whole puppet onto a canvas of another size, empty
// when it is already that size or when there is nothing yet to carry. It goes
// in the same batch as the set_source_image beside it, so the size and the
// picture can never disagree on disk.
function stretchOnto(width, height) {
  const doc = puppet();
  if (doc.width <= 0 || doc.height <= 0) return [];
  if (doc.width === width && doc.height === height) return [];
  return [{command: 'scale_to_size', width, height}];
}

function sourceStep() {
  const doc = puppet();
  const names = session.images.map(image => image.path);
  const images = select(['', ...names], doc.source_image);
  const guides = select(['', ...names], doc.guide_image);
  const width = numberInput(doc.width || 0, 1);
  const height = numberInput(doc.height || 0, 1);

  // Picking a picture applies it at once, and stretches the puppet onto it. The
  // document's size is the coordinate space every joint and outline is written
  // in, and a build refuses a document whose size is not the picture's, so a
  // swap to another resolution has to carry the whole puppet with it.
  const useImage = picked => post(stretchOnto(picked.width, picked.height).concat(
    [{command: 'set_source_image', path: picked.path,
      width: picked.width, height: picked.height}]));
  images.addEventListener('change', () => {
    if (images.value === '') return;
    useImage(session.images.find(image => image.path === images.value));
  });
  guides.addEventListener('change', () =>
    post([{command: 'set_guide_image', path: guides.value}]));

  const applySize = () => {
    if (doc.source_image === '') return;
    post([{command: 'set_source_image', path: doc.source_image,
           width: Number(width.value), height: Number(height.value)}]);
  };
  width.addEventListener('change', applySize);
  height.addEventListener('change', applySize);

  const file = session.images.find(image => image.path === doc.source_image);
  const mismatched = file !== undefined &&
    (file.width !== doc.width || file.height !== doc.height);

  return group(
    field('Source artwork', images),
    note(doc.source_image === ''
      ? 'The source is the picture the parts are cut out of. Pick one and it ' +
        'appears, at its own size.'
      : `${doc.width} × ${doc.height}, taken from the file.`),
    mismatched ? group(
      note(`This puppet is written in ${doc.width} × ${doc.height} coordinates ` +
           `but ${file.path} is ${file.width} × ${file.height}. Nothing can be ` +
           'built until they agree.'),
      button(`Stretch the puppet to ${file.width} × ${file.height}`,
             () => useImage(file), 'primary')) : group(),
    rowOf(field('Width', width), field('Height', height)),
    note('Setting the size here moves nothing: every joint and outline keeps ' +
         'the numbers it had. Picking a picture above stretches them instead.'),
    field('Guide backdrop', guides),
    note('A guide is something to trace a skeleton onto when there is no ' +
         'artwork yet. Nothing reads its pixels and it never reaches a build.'),
    checkbox('Show the posed puppet', view.showBuild,
             value => { view.showBuild = value; saveView(); render(); }),
    checkbox('Show source', view.showSource,
             value => { view.showSource = value; saveView(); render(); }),
    checkbox('Show guide', view.showGuide,
             value => { view.showGuide = value; saveView(); render(); }),
    note('The posed puppet covers the source when both are on, because it is ' +
         'the same artwork after bending.'));
}

function pointInPolygon(point, polygon) {
  let inside = false;
  for (let at = 0, last = polygon.length - 1; at < polygon.length; last = at++) {
    const [ax, ay] = polygon[at];
    const [bx, by] = polygon[last];
    if ((ay > point[1]) === (by > point[1])) continue;
    if (point[0] < (bx - ax) * (point[1] - ay) / (by - ay) + ax) inside = !inside;
  }
  return inside;
}

// The closest point on a polygon's edge, which is where a click that landed
// inside it belongs instead.
function nearestPointOnPolygon(point, polygon) {
  let best = null;
  let distance = Infinity;
  for (let at = 0, last = polygon.length - 1; at < polygon.length; last = at++) {
    const [ax, ay] = polygon[last];
    const [bx, by] = polygon[at];
    const dx = bx - ax;
    const dy = by - ay;
    const length = dx * dx + dy * dy;
    const along = length === 0 ? 0
      : Math.max(0, Math.min(1, ((point[0] - ax) * dx + (point[1] - ay) * dy) / length));
    const candidate = [ax + along * dx, ay + along * dy];
    const gap = Math.hypot(candidate[0] - point[0], candidate[1] - point[1]);
    if (gap < distance) { distance = gap; best = candidate; }
  }
  return best;
}

// Pulls a click that landed inside an already-claimed part back onto that
// part's edge, just outside it.
//
// This is what "the line snaps to the competing boundary" means: with overlap
// off the new part cannot keep those pixels anyway, so the outline is drawn
// where the pixels actually end up rather than somewhere the build then
// silently trims. Only parts declared before this one claim anything from it,
// which is the same rule the build uses.
//
// It moves the points you click. A straight run between two points that are
// both outside can still cut across a corner, and the build's ownership rule is
// what catches that; nothing here can, short of clipping the whole polygon.
function snapOutOfClaimedParts(point) {
  const doc = puppet();
  if (doc.allow_overlap) return point;
  const mine = doc.parts.findIndex(part => part.name === view.selectedPart);
  if (mine <= 0) return point;
  const claimed = doc.parts.slice(0, mine).flatMap(part => part.outlines);

  let moved = point;
  // Escaping one part can land inside the next, so this runs again on the
  // result. Bounded, because two outlines can share an edge and trap a point
  // between them for ever.
  for (let attempt = 0; attempt < 4; ++attempt) {
    const inside = claimed.find(polygon => polygon.length >= 3 && pointInPolygon(moved, polygon));
    if (inside === undefined) return moved;
    const edge = nearestPointOnPolygon(moved, inside);
    const outward = Math.hypot(edge[0] - moved[0], edge[1] - moved[1]);
    // A whole pixel clear of the edge, because the committed outline is rounded
    // to whole pixels and half of one would round straight back inside.
    moved = outward === 0 ? edge
      : [edge[0] + (edge[0] - moved[0]) / outward, edge[1] + (edge[1] - moved[1]) / outward];
  }
  return moved;
}

// Sends the closed shape as a whole new list for that part, because the command
// replaces the list rather than appending to it.
function commitShape() {
  const part = puppet().parts.find(candidate => candidate.name === view.selectedPart);
  if (part === undefined || drawing === null || drawing.length < 3) return;
  const rounded = drawing.map(([x, y]) => [Math.round(x), Math.round(y)]);
  const claiming = view.drawTarget === 'claim';
  const existing = claiming ? part.outlines : part.exclude_outlines;
  const command = claiming ? 'set_part_outline' : 'set_part_exclude_outlines';
  drawing = null;
  post([{command, part: part.name, outlines: [...existing, rounded]}]);
}

function clearShapes() {
  const part = puppet().parts.find(candidate => candidate.name === view.selectedPart);
  if (part === undefined) return;
  drawing = null;
  post([{
    command: view.drawTarget === 'claim' ? 'set_part_outline' : 'set_part_exclude_outlines',
    part: part.name, outlines: []
  }]);
}

function partsStep() {
  const doc = puppet();
  // Drawing needs a part to draw for, so one is always picked when any exist.
  // Nothing to click means nothing to draw, which reads as the tool missing.
  if (doc.parts.length > 0 && !doc.parts.some(part => part.name === view.selectedPart)) {
    view.selectedPart = doc.parts[0].name;
    saveView();
  }
  const name = textInput('', 'part name');
  const first = select(boneNames(), '');
  const second = select(['', ...boneNames()], '');
  const selected = doc.parts.find(part => part.name === view.selectedPart);
  const nodes = [
    list(doc.parts.map(part => ({
      name: part.name,
      detail: `${part.bones.join(' + ')} · ${part.outlines.length} outline(s)`,
      selected: part.name === view.selectedPart
    })), chosen => { view.selectedPart = chosen; saveView(); render(); }),
    field('New part', name),
    rowOf(field('Bone', first), field('Second bone (optional)', second)),
    button('Add part', async () => {
      const added = name.value.trim();
      // Picking it here means the drawing controls are on screen the moment the
      // part exists, rather than after a click nobody knows to make. A refused
      // command leaves no such part, so the old choice comes back.
      const previous = view.selectedPart;
      view.selectedPart = added;
      saveView();
      const ok = await post([{command: 'add_part', name: added,
             bones: second.value === '' ? [first.value] : [first.value, second.value]}]);
      if (ok) return;
      view.selectedPart = previous;
      saveView();
      render();
    }, 'primary'),
    note(doc.parts.length === 0
      ? 'Add a part first. One bone is rigid; two bones must meet at a joint ' +
        'and the part is skinned across them. Drawing appears once a part exists.'
      : 'One bone is rigid. Two bones must meet at a joint and the part is ' +
        'skinned across them. Pick a part above to draw what it owns.'),
    checkbox('Parts may claim the same pixel', doc.allow_overlap,
             value => post([{command: 'set_allow_overlap', allowed: value}])),
    note(doc.allow_overlap
      ? 'On. A shape drawn across another part takes those pixels too, and ' +
        'both parts draw them. Sometimes that is what you want — a coat and ' +
        'the body under it. In motion the two carry the shared pixels apart ' +
        'and they tear.'
      : 'Off. A shape drawn across a part added before it keeps only the free ' +
        'side, right up to the other part’s edge. Nothing you traced is ' +
        'thrown away: turn this back on and the overlap comes back exactly.')];
  if (selected !== undefined) {
    // Drawing comes first: it is the work, and the settings below it are
    // adjustments to work that already exists.
    const target = select(
      [{value: 'claim', label: 'Claim these pixels'},
       {value: 'carve', label: 'Carve a hole instead'}], view.drawTarget);
    target.addEventListener('change', () => {
      view.drawTarget = target.value;
      drawing = null;
      saveView();
      render();
    });
    nodes.push(
      field(`Clicking the canvas draws ${selected.name}`, target),
      note(`Click to drop points around ${selected.name}. Click the first point ` +
           'again, or press Enter, to close the shape. Backspace takes back a ' +
           'point and Escape throws the shape away.'),
      note(doc.allow_overlap
        ? 'A point clicked inside another part stays where you put it, and both ' +
          'parts claim those pixels.'
        : 'A point clicked inside a part added before this one snaps out to that ' +
          'part’s edge, because this part cannot keep those pixels anyway. A ' +
          'straight run between two points can still cut a corner off one; the ' +
          'build gives those pixels back either way.'),
      rowOf(button('Undo point', () => { drawing?.pop(); drawSkeleton(); }),
            button('Close shape', commitShape, 'primary')),
      button(view.drawTarget === 'claim' ? 'Clear all claimed shapes'
                                         : 'Clear all carved holes', clearShapes, 'danger'),
      note(`${selected.outlines.length} claimed, ${selected.exclude_outlines.length} carved. ` +
           'The mesh follows the claimed pixels; nothing paints it separately.'));

    // A part bent by the wrong bone is the failure a name cannot show: the
    // outline is right, the label is right, and the pixels fly off across the
    // body in every frame. Renaming does not fix it, so the bones are editable
    // here and the ones in force are drawn white on the canvas.
    const boneOne = select(boneNames(), selected.bones[0]);
    const boneTwo = select(['', ...boneNames()], selected.bones[1] ?? '');
    nodes.push(
      rowOf(field('Bone', boneOne), field('Second bone (optional)', boneTwo)),
      button('Use these bones', () => post([{
        command: 'set_part_bones', part: selected.name,
        bones: boneTwo.value === '' ? [boneOne.value] : [boneOne.value, boneTwo.value]
      }])),
      note('The outline, the fills and the mesh settings stay put. The white ' +
           'bones on the canvas are the ones this part follows: if they are ' +
           'not inside the shape you traced, this part is on the wrong limb.'));

    // Ownership and depth: which pixels this part gives up, and whether it
    // draws in front of or behind the parts it shares them with.
    const earlier = doc.parts.slice(0, doc.parts.indexOf(selected)).map(part => part.name);
    const conflicts = (session.shared_pixels ?? []).filter(
      pair => pair.first === selected.name || pair.second === selected.name);
    const given = new Map(earlier.map(name => [name, checkbox(
      name, selected.exclude_parts.includes(name), () => {})]));
    if (earlier.length > 0) {
      nodes.push(
        note('Pixels this part gives up. A part can only give up what a part ' +
             'declared before it already claimed, which is why only those are ' +
             'listed.'),
        ...given.values(),
        button('Save what this part gives up', () => post([{
          command: 'set_part_exclude_parts', part: selected.name,
          excluded: earlier.filter(name =>
            given.get(name).querySelector('input').checked)
        }])));
    }
    nodes.push(note(conflicts.length === 0
      ? 'No other part claims a pixel this one claims.'
      : conflicts.map(pair => `${pair.first} and ${pair.second} both claim ` +
          `${pair.pixels} pixels`).join('; ') +
        '. Both draw them and they pull apart in motion. Give them up above, ' +
        'or trace one of the outlines away from the other.'));

    const place = frames().length === 0 ? -1
      : frames()[0].draw_order.indexOf(selected.name);
    nodes.push(
      rowOf(button('Draw further back', () => moveInDrawOrder(selected.name, -1)),
            button('Draw further forward', () => moveInDrawOrder(selected.name, 1))),
      note(place < 0
        ? 'Add a frame before setting draw order.'
        : `Drawn ${place + 1} of ${frames()[0].draw_order.length}, back to ` +
          'front. Whatever is drawn last is in front of everything. This ' +
          'moves the part in every frame at once.'));

    const spacing = numberInput(selected.mesh_spacing, 1);
    const radius = numberInput(selected.joint_blend_radius, 0);
    const lateral = numberInput(selected.joint_blend_lateral_scale, 0);
    nodes.push(
      rowOf(field('Mesh spacing', spacing), field('Blend radius', radius)),
      field('Blend lateral scale', lateral),
      button('Save mesh settings', () => post([{
        command: 'set_part_mesh', part: selected.name, spacing: Number(spacing.value),
        joint_blend_radius: Number(radius.value),
        joint_blend_lateral_scale: Number(lateral.value)
      }])),
      button(`Remove ${selected.name}`, () => post([
        {command: 'remove_part', name: selected.name}]), 'danger'));

    const renamed = textInput(selected.name, 'new part name');
    nodes.push(
      field('Rename this part', renamed),
      button('Rename', async () => {
        const wanted = renamed.value.trim();
        const previous = view.selectedPart;
        view.selectedPart = wanted;
        saveView();
        if (await post([{command: 'rename_part', name: previous, new_name: wanted}])) return;
        view.selectedPart = previous;
        saveView();
        render();
      }),
      note('A name is only a label. Draw orders and other parts pointing at ' +
           'this one follow it, but the bones do not: a part on the wrong limb ' +
           'stays on the wrong limb under a better name. Change the bones above.'));
  }
  return group(...nodes);
}

// The bone stretched furthest from its bind length, over every frame. Moving a
// rest joint changes the bind proportions and leaves every frame bent against
// the new ones, which nothing else on screen shows: the artwork keeps drawing,
// just scaled along that bone. A ratio far from 1 is that state.
function worstBoneStretch() {
  const doc = puppet();
  const span = (pose, bone) => {
    const start = pose[bone.start_joint];
    const end = pose[bone.end_joint];
    if (start === undefined || end === undefined) return null;
    return Math.hypot(end[0] - start[0], end[1] - start[1]);
  };
  let worst = null;
  for (const bone of doc.bones) {
    const rest = span(doc.rest_pose, bone);
    if (rest === null || rest === 0) continue;
    for (const frame of doc.frames) {
      const posed = span(frame.pose, bone);
      if (posed === null) continue;
      const ratio = posed / rest;
      const off = Math.max(ratio, 1 / ratio);
      if (worst === null || off > worst.off) {
        worst = {off, ratio, bone: bone.name, frame: frame.name};
      }
    }
  }
  return worst;
}

// Moves one part a place forward or back in every frame's draw order. Each
// frame carries its own order, so this is one command per frame in a single
// batch: either the part moves through the whole clip or it moves nowhere and
// no frame is left disagreeing with the others.
function moveInDrawOrder(part, delta) {
  const commands = [];
  for (const frame of frames()) {
    const order = [...frame.draw_order];
    const at = order.indexOf(part);
    const to = at + delta;
    if (at < 0 || to < 0 || to >= order.length) {
      setStatus(`${part} cannot move that way in ${frame.name}.`, 'bad');
      return;
    }
    [order[at], order[to]] = [order[to], order[at]];
    commands.push({command: 'set_draw_order', frame: frame.name, order});
  }
  if (commands.length > 0) post(commands);
}

// Moves the frame at `index` by `delta` places. The command takes the whole
// order rather than a move, so the swap happens here and the server only ever
// sees a complete list it can check against what it holds.
function moveFrame(index, delta) {
  const order = frames().map(frame => frame.name);
  const target = index + delta;
  if (target < 0 || target >= order.length) return;
  [order[index], order[target]] = [order[target], order[index]];
  view.frame = target;
  saveView();
  post([{command: 'reorder_frames', order}]);
}

function framesStep() {
  const doc = puppet();
  const prefix = textInput('frame', 'name prefix');
  const count = numberInput(12, 1);
  const copyFrom = select(['', ...frames().map(frame => frame.name)], '');
  const anchor = select(frames().map(frame => frame.name), doc.anchor_frame);
  const frame = currentFrame();
  const rename = textInput(frame?.name ?? '', 'new name');
  const fps = numberInput(doc.fps, 1);
  const stretch = worstBoneStretch();
  return group(
    rowOf(button('‹ Previous', () => step(-1)),
          button(playing === null ? 'Play' : 'Pause', togglePlay)),
    button('Next ›', () => step(1)),
    list(frames().map((entry, index) => ({
      name: entry.name,
      detail: entry.name === doc.anchor_frame ? 'anchor' : '',
      selected: index === view.frame
    })), chosen => {
      view.frame = frames().findIndex(entry => entry.name === chosen);
      saveView();
      render();
    }),
    rowOf(field('Name prefix', prefix), field('How many', count)),
    field('Copy pose from', copyFrom),
    button('Add frames', () => post([{
      command: 'add_frames', name_prefix: prefix.value,
      count: Number(count.value), copy_from: copyFrom.value
    }]), 'primary'),
    note('With no frame to copy, new frames take the rest pose. That is how ' +
         'twelve frames come from one base skeleton.'),
    frame === null ? note('No frames yet.') : group(
      rowOf(button('↑ Move earlier', () => moveFrame(view.frame, -1)),
            button('↓ Move later', () => moveFrame(view.frame, 1))),
      field('Rename this frame', rename),
      button('Rename', () => post([{
        command: 'rename_frame', name: frame.name, new_name: rename.value.trim()
      }])),
      note('Renaming carries the anchor and every draw order along with it.')),
    button('Move every frame onto the rest pose', () => {
      if (frame === null) return;
      post([{command: 'rebase_frames', from_frame: frame.name}]);
    }),
    note(frame === null ? 'No frames yet.'
      : `Shifts the whole clip so ${frame.name} lands exactly on the rest pose, ` +
        'keeping every frame\u2019s motion. An imported clip is posed in the ' +
        'rig\u2019s own coordinates, which have nothing to do with where this ' +
        'drawing sits; without this every frame yanks the artwork across the ' +
        'canvas. Use it once, on the frame closest to the drawing.'),
    note(stretch === null
      ? 'No bone to measure yet.'
      : `Worst bone stretch ${stretch.ratio.toFixed(2)}× — ${stretch.bone} in ` +
        `${stretch.frame}. 1.00 means the frames still match the bind pose. ` +
        (stretch.off > 1.25
          ? 'Far from 1 usually means a rest joint moved after these frames ' +
            'were posed, so every frame is now bent against proportions it ' +
            'was never drawn for.'
          : 'That is close enough that nothing is being scaled by accident.')),
    button('Fit every frame to the rest bone lengths', () => post(
      frames().map(entry => ({command: 'fit_bone_lengths', frame: entry.name})))),
    note('Keeps the direction each frame points a bone in, and forces the ' +
         'length it has in the rest pose. A clip drawn flat foreshortens: a leg ' +
         'swinging toward the viewer is drawn short, and the deformer reads a ' +
         'short bone as a shrunk limb. This drops the shrinking and keeps the ' +
         'turning.'),
    rowOf(field('Frames per second', fps),
          button('Set', () => post([{command: 'set_frame_rate', fps: Number(fps.value)}]))),
    note('What the Play button runs at, and the rate a clip written out as a ' +
         'rig carries.'),
    field('Anchor frame', anchor),
    button('Set anchor', () => post([{command: 'set_anchor_frame', name: anchor.value}])),
    note('The anchor is the frame the editor opens on. It does not change how ' +
         'anything is built.'),
    checkbox('Keep bone length while dragging', view.keepBoneLength, value => {
      view.keepBoneLength = value;
      saveView();
      render();
    }),
    note('On, a dragged joint swings around the joint it hangs from at the ' +
         'length it already had, and everything below it turns with it. A ' +
         'joint that hangs from nothing slides instead and carries the whole ' +
         'rig, which is how a skeleton is moved onto the artwork. Off, the ' +
         'joint goes where the mouse goes and its bones stretch.'),
    checkbox('Dragging a joint moves every frame', view.scope === 'all_frames', value => {
      view.scope = value ? 'all_frames' : 'frame';
      saveView();
      render();
    }),
    note('Moving every frame shifts that joint by the same amount everywhere, ' +
         'so each frame keeps its own difference from this one.'),
    frame === null ? note('No frames yet.')
                   : button(`Delete ${frame.name}`, () => post([
                       {command: 'remove_frame', name: frame.name}]), 'danger'));
}

function exportStep() {
  const doc = puppet();
  return group(
    note(`${Object.keys(doc.rest_pose).length} joints, ${doc.bones.length} bones, ` +
         `${doc.parts.length} parts, ${doc.frames.length} frames.`),
    note(session.ready
      ? 'This document builds. Render it with render_layered_puppet --document.'
      : `Not buildable yet: ${session.blocker}`),
    note('Built parts: ' + (session.built_parts.join(', ') || 'none')),
    checkbox('Show the posed puppet', view.showBuild,
             value => { view.showBuild = value; saveView(); render(); }),
    note('The document is saved after every accepted edit, so there is nothing ' +
         'here to press. Zoom, playback and which step is open live in this ' +
         'browser only and are never written to it.'));
}

function zoomControl() {
  const node = select(['1', '2', '3', '4', '6', '8'], String(view.zoom));
  node.addEventListener('change', () => { view.zoom = Number(node.value); saveView(); render(); });
  return field('Zoom', node);
}

function render() {
  renderWorkspace();
  if (session.open_document === '') {
    document.querySelector('#steps').replaceChildren();
    document.querySelector('#step-title').textContent = 'No document open';
    document.querySelector('#blocker').textContent = '';
    controls.replaceChildren(note(
      'Pick a puppet from the list above, or name one and press New puppet. ' +
      'A new puppet is empty and starts at Source, where it asks for the ' +
      'artwork its parts are cut out of.'));
    artworkContext.clearRect(0, 0, artwork.width, artwork.height);
    skeletonContext.clearRect(0, 0, skeleton.width, skeleton.height);
    return;
  }
  renderSteps();
  document.querySelector('#step-title').textContent = STEPS[view.step];
  // One line, the same on every step: the single thing standing between this
  // document and a build. Per-step wording used to hide a real failure behind a
  // green step, which is how a puppet sized unlike its picture looked fine.
  document.querySelector('#blocker').textContent = session.ready ? '' : session.blocker;
  const builders = [sourceStep, skeletonStep, partsStep, framesStep, exportStep];
  controls.replaceChildren(builders[view.step](), zoomControl());
  applyZoom();
  drawArtwork();
  drawSkeleton();
}

function step(delta, canvasOnly) {
  if (frames().length === 0) return;
  view.frame = (view.frame + delta + frames().length) % frames().length;
  saveView();
  // While playing, only the canvas is redrawn. Rebuilding the panel eight times
  // a second tears the Pause button out from under the click that meant to hit
  // it.
  if (canvasOnly === true) {
    drawArtwork();
    drawSkeleton();
    return;
  }
  render();
}
function togglePlay() {
  if (playing !== null) {
    window.clearInterval(playing);
    playing = null;
  } else {
    playing = window.setInterval(() => step(1, true), 1000 / puppet().fps);
  }
  render();
}

// The bone graph read as a tree: which joint each one hangs from, and what
// hangs below it. A joint that is the end of two bones has no single parent, so
// it is treated as a root and moves on its own.
function skeletonTree() {
  const parents = new Map();
  const ambiguous = new Set();
  for (const bone of puppet().bones) {
    if (parents.has(bone.end_joint)) ambiguous.add(bone.end_joint);
    parents.set(bone.end_joint, bone.start_joint);
  }
  for (const joint of ambiguous) parents.delete(joint);
  const children = new Map();
  for (const [child, parent] of parents) {
    if (!children.has(parent)) children.set(parent, []);
    children.get(parent).push(child);
  }
  return {parents, children};
}

function descendantsOf(children, joint) {
  const found = [];
  const seen = new Set([joint]);
  const pending = [joint];
  while (pending.length > 0) {
    for (const child of children.get(pending.pop()) ?? []) {
      // A bone graph is not checked for loops, so a joint is only walked once.
      if (seen.has(child)) continue;
      seen.add(child);
      found.push(child);
      pending.push(child);
    }
  }
  return found;
}

// Swings a joint around the one it hangs from, keeping that bone the length it
// already was, and turns everything below it by the same angle. Dragging then
// changes the pose without stretching the skeleton.
function swungPose(pose, joint, wanted) {
  const {parents, children} = skeletonTree();
  const parent = parents.get(joint);
  // A root hangs from nothing, so there is no bone to swing it around. It
  // slides instead and takes everything below it along, which is the only way
  // to move a whole rig onto the artwork without stretching the bone it is
  // dragged by.
  if (parent === undefined) {
    const shift = [wanted[0] - pose[joint][0], wanted[1] - pose[joint][1]];
    const moved = new Map([[joint, wanted]]);
    for (const below of descendantsOf(children, joint)) {
      moved.set(below, [pose[below][0] + shift[0], pose[below][1] + shift[1]]);
    }
    return moved;
  }

  const anchor = pose[parent];
  const was = pose[joint];
  const length = Math.hypot(was[0] - anchor[0], was[1] - anchor[1]);
  const reach = Math.hypot(wanted[0] - anchor[0], wanted[1] - anchor[1]);
  if (length === 0 || reach === 0) return new Map([[joint, was]]);

  const angle = Math.atan2(wanted[1] - anchor[1], wanted[0] - anchor[0]) -
                Math.atan2(was[1] - anchor[1], was[0] - anchor[0]);
  const cosine = Math.cos(angle);
  const sine = Math.sin(angle);
  const turn = point => {
    const x = point[0] - anchor[0];
    const y = point[1] - anchor[1];
    return [anchor[0] + cosine * x - sine * y, anchor[1] + sine * x + cosine * y];
  };
  const moved = new Map([[joint, turn(was)]]);
  for (const below of descendantsOf(children, joint)) moved.set(below, turn(pose[below]));
  return moved;
}

function showTip(event, joint, point) {
  const bounds = stage.getBoundingClientRect();
  tip.textContent = `${joint}  ${Math.round(point[0])}, ${Math.round(point[1])}`;
  tip.style.left = `${event.clientX - bounds.left + 12}px`;
  tip.style.top = `${event.clientY - bounds.top + 12}px`;
  tip.hidden = false;
}

function nearestJoint(pose, point, within) {
  let nearest = null;
  let distance = within;
  for (const [name, joint] of Object.entries(pose)) {
    const candidate = Math.hypot(joint[0] - point[0], joint[1] - point[1]);
    if (candidate < distance) { distance = candidate; nearest = name; }
  }
  return nearest;
}

function pointerPoint(event) {
  const bounds = skeleton.getBoundingClientRect();
  const {width, height} = canvasSize();
  return [(event.clientX - bounds.left) * width / bounds.width,
          (event.clientY - bounds.top) * height / bounds.height];
}

skeleton.addEventListener('pointerdown', event => {
  const point = pointerPoint(event);
  if (view.step === 2) {
    if (view.selectedPart === '') {
      setStatus('Pick a part first, then click to draw what it owns.', 'bad');
      return;
    }
    if (drawing !== null && drawing.length >= 3 &&
        Math.hypot(drawing[0][0] - point[0], drawing[0][1] - point[1]) < 5) {
      commitShape();
      return;
    }
    drawing = [...(drawing ?? []), snapOutOfClaimedParts(point)];
    drawSkeleton();
    return;
  }
  const pose = activePose();
  const nearest = nearestJoint(pose, point, 10);
  // On the skeleton step an empty patch of canvas places a new joint; on the
  // frames step it does nothing, because a frame poses joints and never adds
  // them.
  if (nearest === null) {
    if (view.step !== 1) return;
    const nameField = controls.querySelector('input[placeholder="joint name"]');
    const name = nameField?.value.trim() ?? '';
    if (name === '') {
      setStatus('Type a joint name first, then click where it goes.', 'bad');
      return;
    }
    const chain = controls.querySelector('input[placeholder="chain"]')?.value.trim() ?? '';
    if (chain === '') {
      setStatus('Name the limb this joint belongs to, such as arm_l.', 'bad');
      return;
    }
    view.chain = chain;
    saveView();
    post([{command: 'add_joint', name, chain,
           rest: [Math.round(point[0]), Math.round(point[1])]}]);
    return;
  }
  if (view.step !== 1 && view.step !== 3) return;
  // The starting pose is kept because a swing is measured from where the joint
  // was, not from wherever the last mouse move left it.
  dragging = {joint: nearest, point, from: structuredClone(pose), moved: new Map()};
  skeleton.setPointerCapture(event.pointerId);
  drawSkeleton();
});

skeleton.addEventListener('pointermove', event => {
  const point = pointerPoint(event);
  const pose = activePose();
  if (dragging === null) {
    const hovered = view.step === 2 ? null : nearestJoint(pose, point, 8);
    if (hovered === null) tip.hidden = true;
    else showTip(event, hovered, pose[hovered]);
    return;
  }
  // The drag is previewed here and committed once, on release. A command per
  // mouse move would be a hundred saved documents for one gesture.
  dragging.point = point;
  dragging.moved = view.keepBoneLength
      ? swungPose(dragging.from, dragging.joint, point)
      : new Map([[dragging.joint, point]]);
  for (const [name, moved] of dragging.moved) pose[name] = moved;
  showTip(event, dragging.joint, pose[dragging.joint]);
  drawSkeleton();
});

skeleton.addEventListener('pointerup', event => {
  if (dragging === null) return;
  const moved = dragging.moved.size > 0 ? dragging.moved
                                        : new Map([[dragging.joint, dragging.point]]);
  dragging = null;
  tip.hidden = true;
  skeleton.releasePointerCapture(event.pointerId);

  // A swing turns a whole chain, so one gesture can be several joints. They go
  // in one batch, which the server takes whole or refuses whole.
  const round = point => [Math.round(point[0]), Math.round(point[1])];
  if (view.step === 1) {
    post([...moved].map(([name, point]) =>
      ({command: 'move_rest_joint', name, rest: round(point)})));
    return;
  }
  const frame = currentFrame();
  if (frame === null) return;
  post([...moved].map(([joint, point]) =>
    ({command: 'pose_joint', frame: frame.name, joint, point: round(point), scope: view.scope})));
});

window.addEventListener('keydown', event => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(event.target.tagName)) return;
  if (drawing !== null) {
    if (event.key === 'Enter') { commitShape(); return; }
    if (event.key === 'Escape') { drawing = null; drawSkeleton(); return; }
    if (event.key === 'Backspace') {
      event.preventDefault();
      drawing.pop();
      if (drawing.length === 0) drawing = null;
      drawSkeleton();
      return;
    }
  }
  if (event.key === 'ArrowLeft') step(-1);
  if (event.key === 'ArrowRight') step(1);
});

(async function start() {
  try {
    const response = await fetch('/api/session', {cache: 'no-store'});
    if (!response.ok) throw new Error(await response.text());
    session = await response.json();
    await loadSprites();
    await loadBuild();
    render();
    setStatus(session.ready ? `${session.open_document}: ready to build.`
                            : `${session.open_document || 'No document'}: ${session.blocker}`,
              session.ready ? 'good' : '');
  } catch (error) {
    setStatus(`Could not load the session: ${error}`, 'bad');
  }
})();
</script>
</body>
</html>
